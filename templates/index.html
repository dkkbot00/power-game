<!DOCTYPE html>
<html>
<head>
<title>Power Tic Tac Toe</title>
<style>
body {
    background: #111;
    color: white;
    font-family: Arial;
    text-align: center;
}

.container {
    display: flex;
    justify-content: space-around;
    align-items: center;
    margin-top: 20px;
}

.player {
    width: 120px;
}

.player h3 {
    margin: 5px;
}

.reaction {
    font-size: 25px;
}

.board {
    display: grid;
    grid-template-columns: repeat(3, 80px);
    grid-gap: 5px;
    margin: 20px auto;
}

.cell {
    width: 80px;
    height: 80px;
    background: #222;
    font-size: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 10px;
}

.cell:hover {
    background: #333;
}

#status {
    margin-top: 10px;
    font-size: 18px;
}

.premium {
    margin-top: 15px;
    padding: 10px;
    background: gold;
    color: black;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
</style>
</head>
<body>

<h2>🔥 Power Tic Tac Toe 🔥</h2>

<div class="container">
    <div class="player">
        <h3>Player X</h3>
        <div class="reaction" id="rxnX">🙂</div>
    </div>

    <div class="board" id="board"></div>

    <div class="player">
        <h3>AI Player O</h3>
        <div class="reaction" id="rxnO">😎</div>
    </div>
</div>

<div id="status">Player X Turn</div>

<button class="premium" onclick="premiumChat()">💬 Chat (Premium)</button>

<script>
let board = ["", "", "", "", "", "", "", "", ""];
let currentPlayer = "X";
const boardDiv = document.getElementById("board");
const status = document.getElementById("status");

function drawBoard() {
    boardDiv.innerHTML = "";
    board.forEach((cell, index) => {
        const div = document.createElement("div");
        div.classList.add("cell");
        div.innerText = cell;
        div.onclick = () => makeMove(index);
        boardDiv.appendChild(div);
    });
}

function makeMove(index) {
    if (board[index] !== "" || currentPlayer !== "X") return;

    board[index] = "X";
    currentPlayer = "O";
    updateReactions();
    checkWinner();
    drawBoard();
    setTimeout(aiMove, 500);
}

function aiMove() {
    let empty = board.map((v, i) => v === "" ? i : null).filter(v => v !== null);
    if (empty.length === 0) return;

    let randomIndex = empty[Math.floor(Math.random() * empty.length)];
    board[randomIndex] = "O";
    currentPlayer = "X";
    updateReactions();
    checkWinner();
    drawBoard();
}

function checkWinner() {
    const wins = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
    ];

    for (let combo of wins) {
        const [a,b,c] = combo;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
            status.innerText = board[a] + " Wins! 🔥";
            document.getElementById("rxnX").innerText = board[a]=="X"?"😎":"😢";
            document.getElementById("rxnO").innerText = board[a]=="O"?"😎":"😢";
            return;
        }
    }

    if (!board.includes("")) {
        status.innerText = "Draw 🤝";
    }
}

function updateReactions() {
    document.getElementById("rxnX").innerText = currentPlayer=="X"?"🙂":"⏳";
    document.getElementById("rxnO").innerText = currentPlayer=="O"?"🙂":"⏳";
}

function premiumChat() {
    alert("💎 Premium Feature!\nUpgrade to unlock chat.");
}

drawBoard();
</script>

</body>
</html>
