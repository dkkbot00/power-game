<!DOCTYPE html>
<html>
<head>
<title>Power Cyber X</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>

body{
margin:0;
background:linear-gradient(-45deg,#140021,#2b0050,#1a0033,#000);
background-size:400% 400%;
animation:bg 10s ease infinite;
font-family:Arial;
text-align:center;
color:white;
overflow:hidden;
}

@keyframes bg{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

h2{
color:#c300ff;
text-shadow:0 0 20px #c300ff;
margin-top:20px;
}

.board{
display:grid;
grid-template-columns:repeat(3,100px);
gap:12px;
justify-content:center;
margin-top:20px;
}

.cell{
width:100px;
height:100px;
background:#111;
border-radius:20px;
font-size:45px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
box-shadow:0 0 20px #c300ff;
transition:.2s;
}

.cell:hover{
box-shadow:0 0 35px #ff00ff;
transform:scale(1.05);
}

.X{
color:#00f7ff;
text-shadow:0 0 20px #00f7ff;
}

.O{
color:#ff00c8;
text-shadow:0 0 20px #ff00c8;
}

#winner{
height:35px;
margin-top:10px;
font-size:20px;
color:gold;
}

.score{
margin-top:10px;
font-size:18px;
}

#musicToggle{
position:absolute;
top:15px;
right:15px;
width:45px;
height:45px;
border-radius:50%;
background:#1a0033;
border:2px solid #c300ff;
color:white;
font-size:18px;
cursor:pointer;
box-shadow:0 0 15px #c300ff;
}

#premiumBtn{
margin-top:20px;
padding:10px 20px;
background:#1a0033;
border:1px solid #c300ff;
color:white;
cursor:pointer;
border-radius:10px;
box-shadow:0 0 15px #c300ff;
}

#premiumPopup{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#111;
padding:25px;
border:2px solid #c300ff;
box-shadow:0 0 25px #c300ff;
border-radius:15px;
}

</style>
</head>
<body>

<button id="musicToggle">🔊</button>

<h2>🔥 Power Cyber X 🔥</h2>

<div id="winner"></div>

<div class="score">
Player: <span id="scoreX">0</span> |
AI: <span id="scoreO">0</span>
</div>

<div class="board" id="board"></div>

<button id="premiumBtn">💬 Premium Chat</button>

<div id="premiumPopup">
<h3>🔒 Premium Locked</h3>
<p>Instagram: me.divakar00</p>
<p>₹1 = 1 Day</p>
<p>₹5 = 1 Week</p>
<button onclick="closePremium()">Close</button>
</div>

<script>

let board=["","","","","","","","",""];
let currentPlayer="X";
let gameActive=true;
let scoreX=0, scoreO=0;

const boardDiv=document.getElementById("board");
const winner=document.getElementById("winner");

const bgMusic=new Audio("/static/bg.mp3");
bgMusic.loop=true;
bgMusic.volume=0.15;

const xSound=new Audio("/static/x.mp3");
const oSound=new Audio("/static/o.mp3");
const winSound=new Audio("/static/win.mp3");
const loseSound=new Audio("/static/lose.mp3");
const clickSound=new Audio("/static/click.mp3");

let musicStarted=false;
let musicOn=true;

function drawBoard(){
boardDiv.innerHTML="";
board.forEach((cell,i)=>{
const div=document.createElement("div");
div.classList.add("cell");
if(cell) div.classList.add(cell);
div.innerText=cell;
div.onclick=()=>makeMove(i);
boardDiv.appendChild(div);
});
}

function makeMove(i){
if(!gameActive) return;
if(board[i]!=="" || currentPlayer!=="X") return;

startMusic();

board[i]="X";
xSound.play();
currentPlayer="O";
drawBoard();

if(!checkWinner()) setTimeout(aiMove,1500);
}

function aiMove(){
let empty=board.map((v,i)=>v===""?i:null).filter(v=>v!==null);
let move=empty[Math.floor(Math.random()*empty.length)];
board[move]="O";
oSound.play();
currentPlayer="X";
drawBoard();
checkWinner();
}

function checkWinner(){
const winComb=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

for(let [a,b,c] of winComb){
if(board[a] && board[a]===board[b] && board[a]===board[c]){
gameActive=false;
if(board[a]==="X"){
winner.innerText="🥳 YOU WIN!";
winSound.play();
scoreX++;
}else{
winner.innerText="😈 AI WINS!";
loseSound.play();
scoreO++;
}
updateScore();
setTimeout(resetGame,2000);
return true;
}
}

if(!board.includes("")){
winner.innerText="DRAW!";
setTimeout(resetGame,2000);
return true;
}
return false;
}

function resetGame(){
board=["","","","","","","","",""];
currentPlayer="X";
gameActive=true;
winner.innerText="";
drawBoard();
}

function updateScore(){
document.getElementById("scoreX").innerText=scoreX;
document.getElementById("scoreO").innerText=scoreO;
}

function startMusic(){
if(!musicStarted){
bgMusic.play();
musicStarted=true;
}
}

document.getElementById("musicToggle").onclick=function(){
clickSound.play();
if(musicOn){
bgMusic.pause();
this.innerText="🔇";
musicOn=false;
}else{
bgMusic.play();
this.innerText="🔊";
musicOn=true;
}
};

document.getElementById("premiumBtn").onclick=function(){
clickSound.play();
document.getElementById("premiumPopup").style.display="block";
};

function closePremium(){
document.getElementById("premiumPopup").style.display="none";
}

drawBoard();

</script>
</body>
</html>
