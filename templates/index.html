<!DOCTYPE html>
<html>
<head>
<title>Power Tic Tac Toe ULTRA</title>
<style>
body {
    background: #000;
    color: white;
    font-family: Arial;
    text-align: center;
}

h2 {
    color: #0ff;
    text-shadow: 0 0 10px #0ff;
}

#winnerBanner {
    font-size: 22px;
    color: gold;
    height: 30px;
    margin-bottom: 10px;
}

.scoreBoard {
    margin-bottom: 10px;
    font-size: 18px;
}

.board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    gap: 10px;
    justify-content: center;
}

.cell {
    width: 100px;
    height: 100px;
    background: #111;
    border-radius: 15px;
    font-size: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.2s;
    box-shadow: 0 0 10px #0ff;
}

.cell:hover {
    background: #222;
    box-shadow: 0 0 20px #0ff;
}

.X { color: #0ff; text-shadow: 0 0 15px #0ff; }
.O { color: #f0f; text-shadow: 0 0 15px #f0f; }

.modeDisplay {
    margin-bottom: 10px;
    font-size: 16px;
    color: #aaa;
}
</style>
</head>
<body>

<h2>🔥 Power Tic Tac Toe ULTRA 🔥</h2>

<div class="modeDisplay" id="modeDisplay">Mode: HARD 😈</div>

<div id="winnerBanner"></div>

<div class="scoreBoard">
🏆 Player X: <span id="scoreX">0</span> |
🤖 AI O: <span id="scoreO">0</span>
</div>

<div class="board" id="board"></div>

<script>
let board = ["","","","","","","","",""];
let currentPlayer = "X";
let scoreX = 0;
let scoreO = 0;
let aiWinStreak = 0;
let aiMode = "HARD";

const boardDiv = document.getElementById("board");
const banner = document.getElementById("winnerBanner");
const modeDisplay = document.getElementById("modeDisplay");

function drawBoard(){
    boardDiv.innerHTML = "";
    board.forEach((cell,index)=>{
        const div = document.createElement("div");
        div.classList.add("cell");
        if(cell) div.classList.add(cell);
        div.innerText = cell;
        div.onclick = ()=>makeMove(index);
        boardDiv.appendChild(div);
    });
}

function makeMove(index){
    if(board[index]!=="" || currentPlayer!=="X") return;
    board[index]="X";
    currentPlayer="O";
    drawBoard();
    if(!checkWinner()) setTimeout(aiMove,500);
}

function aiMove(){
    let move;
    if(aiMode==="HARD"){
        move = bestMove();
    } else {
        move = randomMove();
    }
    board[move]="O";
    currentPlayer="X";
    drawBoard();
    checkWinner();
}

function randomMove(){
    let empty = board.map((v,i)=>v===""?i:null).filter(v=>v!==null);
    return empty[Math.floor(Math.random()*empty.length)];
}

function bestMove(){
    for(let i=0;i<9;i++){
        if(board[i]===""){
            board[i]="O";
            if(isWinning("O")){ board[i]=""; return i; }
            board[i]="";
        }
    }
    for(let i=0;i<9;i++){
        if(board[i]===""){
            board[i]="X";
            if(isWinning("X")){ board[i]=""; return i; }
            board[i]="";
        }
    }
    return randomMove();
}

function isWinning(player){
    const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    return wins.some(([a,b,c])=>board[a]===player&&board[b]===player&&board[c]===player);
}

function checkWinner(){
    if(isWinning("X")){
        banner.innerText="🥳 Player X Wins!";
        scoreX++;
        aiWinStreak=0;
        updateScore();
        setTimeout(resetGame,2000);
        return true;
    }
    if(isWinning("O")){
        banner.innerText="😈 AI Wins!";
        scoreO++;
        aiWinStreak++;
        if(aiWinStreak>=4){
            aiMode="MEDIUM";
            modeDisplay.innerText="Mode: MEDIUM 🙂";
        }
        updateScore();
        setTimeout(resetGame,2000);
        return true;
    }
    if(!board.includes("")){
        banner.innerText="🤝 Draw!";
        setTimeout(resetGame,2000);
        return true;
    }
    return false;
}

function updateScore(){
    document.getElementById("scoreX").innerText=scoreX;
    document.getElementById("scoreO").innerText=scoreO;
}

function resetGame(){
    board=["","","","","","","","",""];
    banner.innerText="";
    drawBoard();
}

drawBoard();
</script>

</body>
</html>
